<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Bingo</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#f1f5f9; --mut:#94a3b8;
    --acc:#f59e0b; --hit:#22c55e; --win:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  h1{text-align:center;margin:8px 0 4px;font-size:2rem;letter-spacing:.1em;color:var(--acc)}
  .sub{text-align:center;color:var(--mut);margin-bottom:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  label{display:block;margin:12px 0 6px;color:var(--mut);font-size:.9rem}
  input[type=number],input[type=text]{background:#0b1220;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:1rem;width:100%}
  button{background:var(--acc);color:#111827;border:0;border-radius:8px;padding:10px 16px;font-size:1rem;font-weight:700;cursor:pointer}
  button.sec{background:#334155;color:var(--txt)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .chk{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
  .chk label{display:flex;align-items:center;gap:6px;margin:0;color:var(--txt)}
  .hidden{display:none}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .tools input{flex:1;min-width:120px}
  .info{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .info .nm{font-size:1.15rem;font-weight:700}
  .info .last{color:var(--mut)}
  .info .last b{color:var(--hit);font-size:1.5rem}
  .grid{display:grid;gap:5px}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#0b1220;border:1px solid var(--line);border-radius:8px;font-weight:700;font-size:clamp(.85rem,3.6vw,1.3rem);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .cell.hit{background:var(--hit);color:#052e16;border-color:var(--hit)}
  .cell.line{background:var(--win);color:#fff;border-color:var(--win)}
  .banner{text-align:center;padding:18px;border-radius:14px;background:linear-gradient(135deg,#b91c1c,#f59e0b);font-size:1.5rem;font-weight:800;margin-bottom:16px}
  .hist{margin-top:14px;color:var(--mut);font-size:.9rem;line-height:1.6;word-break:break-word}
  .hist b{color:var(--txt)}
  .note{font-size:.85rem;color:var(--mut);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 BINGO</h1>
  <div class="sub">Isi papan acak, tandai angka yang disebut, jadilah yang bingo duluan!</div>

  <!-- SETUP -->
  <div id="setup" class="panel">
    <label for="name">Nama (opsional)</label>
    <input type="text" id="name" placeholder="Nama kamu" maxlength="24">

    <label for="size">Ukuran matriks (N × N), 3–10</label>
    <input type="number" id="size" min="3" max="10" value="5" inputmode="numeric">
    <div class="note" id="hint">Matriks 5×5 berisi angka acak 1–25.</div>

    <label>Garis kemenangan</label>
    <div class="chk">
      <label><input type="checkbox" checked disabled> Vertikal (atas → bawah)</label>
      <label><input type="checkbox" id="optH"> Horizontal</label>
      <label><input type="checkbox" id="optD"> Diagonal</label>
    </div>

    <div class="tools"><button id="startBtn">Mulai Game</button></div>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div id="banner" class="banner hidden">🏆 BINGO!</div>
    <div class="panel">
      <div class="info">
        <div class="nm" id="pname"></div>
        <div class="last">Angka terakhir: <b id="lastNum">-</b></div>
      </div>
      <div id="grid" class="grid"></div>
      <div class="tools">
        <input type="number" id="numInput" placeholder="Angka yang disebut" inputmode="numeric">
        <button id="callBtn">Tandai</button>
      </div>
      <div class="tools">
        <button id="randBtn" class="sec">🎲 Undi angka acak</button>
        <button id="undoBtn" class="sec">↩ Batalkan</button>
        <button id="resetBtn" class="sec">Game baru</button>
      </div>
      <div class="hist" id="hist"></div>
      <div class="note">Ketik angka yang disebut lawan main, atau ketuk langsung kotak di papan. Tombol "Undi" untuk main sendiri.</div>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const KEY = 'bingo-state-v1';
  let S = null; // {name, N, nums, order, useH, useD}

  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function shuffle(a){
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return null;
      const s = JSON.parse(raw);
      return (s && s.nums && s.nums.length === s.N*s.N) ? s : null;
    }catch(e){ return null; }
  }

  $('size').addEventListener('input', () => {
    const n = clamp(parseInt($('size').value)||5, 3, 10);
    $('hint').textContent = `Matriks ${n}×${n} berisi angka acak 1–${n*n}.`;
  });

  function start(){
    const N = clamp(parseInt($('size').value)||5, 3, 10);
    S = {
      name: $('name').value.trim() || 'Pemain',
      N,
      nums: shuffle(Array.from({length:N*N},(_,k)=>k+1)),
      order: [],           // urutan angka yang ditandai
      useH: $('optH').checked,
      useD: $('optD').checked
    };
    save();
    show();
  }

  function findLines(){
    const {N, nums, order, useH, useD} = S;
    const called = new Set(order);
    const hit = i => called.has(nums[i]);
    const res = [];
    for(let c=0;c<N;c++){
      const idx = Array.from({length:N},(_,r)=>r*N+c);
      if(idx.every(hit)) res.push(idx);
    }
    if(useH) for(let r=0;r<N;r++){
      const idx = Array.from({length:N},(_,c)=>r*N+c);
      if(idx.every(hit)) res.push(idx);
    }
    if(useD){
      const d1 = Array.from({length:N},(_,i)=>i*N+i);
      const d2 = Array.from({length:N},(_,i)=>i*N+(N-1-i));
      if(d1.every(hit)) res.push(d1);
      if(d2.every(hit)) res.push(d2);
    }
    return res;
  }

  function mark(n){
    if(!S) return;
    if(findLines().length) return; // sudah bingo
    if(!Number.isInteger(n) || n<1 || n>S.N*S.N){ alert(`Masukkan angka 1–${S.N*S.N}.`); return; }
    if(S.order.includes(n)){ alert('Angka '+n+' sudah ditandai.'); return; }
    S.order.push(n);
    $('numInput').value = '';
    save();
    show();
  }

  function show(){
    $('setup').classList.add('hidden');
    $('game').classList.remove('hidden');
    const {N, nums, order} = S;
    const lines = findLines();
    const won = lines.length > 0;
    const lineCells = new Set(lines.flat());
    const called = new Set(order);

    $('pname').textContent = S.name + ' • ' + N + '×' + N;
    $('lastNum').textContent = order.length ? order[order.length-1] : '-';
    $('banner').classList.toggle('hidden', !won);
    $('banner').textContent = '🏆 BINGO! ' + S.name + ' menang!';

    const g = $('grid');
    g.style.gridTemplateColumns = `repeat(${N},1fr)`;
    g.innerHTML = '';
    nums.forEach((n,i) => {
      const c = document.createElement('div');
      c.className = 'cell' + (lineCells.has(i) ? ' line' : called.has(n) ? ' hit' : '');
      c.textContent = n;
      c.addEventListener('click', () => mark(n));
      g.appendChild(c);
    });

    $('callBtn').disabled = $('randBtn').disabled = $('numInput').disabled = won;
    $('undoBtn').disabled = order.length === 0;
    $('hist').innerHTML = order.length
      ? 'Sudah disebut (' + order.length + '): <b>' + order.join(', ') + '</b>'
      : 'Belum ada angka yang disebut.';
  }

  $('startBtn').addEventListener('click', start);
  $('callBtn').addEventListener('click', () => mark(parseInt($('numInput').value)));
  $('numInput').addEventListener('keydown', e => { if(e.key==='Enter') mark(parseInt($('numInput').value)); });
  $('randBtn').addEventListener('click', () => {
    const left = [];
    for(let i=1;i<=S.N*S.N;i++) if(!S.order.includes(i)) left.push(i);
    if(left.length) mark(left[Math.floor(Math.random()*left.length)]);
  });
  $('undoBtn').addEventListener('click', () => { S.order.pop(); save(); show(); });
  $('resetBtn').addEventListener('click', () => {
    if(!confirm('Mulai game baru? Papan saat ini akan hilang.')) return;
    S = null;
    try{ localStorage.removeItem(KEY); }catch(e){}
    $('game').classList.add('hidden');
    $('setup').classList.remove('hidden');
  });

  // Lanjutkan game jika halaman di-refresh
  const saved = load();
  if(saved){ S = saved; show(); }
})();
</script>
</body>
</html>
